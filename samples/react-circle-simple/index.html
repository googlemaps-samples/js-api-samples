<!-- [START maps_react_circle_simple] -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
        <title>React - Simple Circle</title>
        <meta name="description" content="React Simple Circle Example" />
        <style>
            body {
                margin: 0;
                font-family: sans-serif;
            }
            #app {
                width: 100vw;
                height: 100vh;
                position: relative;
            }
            .control-panel {
                position: absolute;
                top: 10px;
                left: 10px;
                background: white;
                padding: 10px;
                border-radius: 4px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.3);
                z-index: 10;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .control-panel label {
                font-size: 14px;
                display: flex;
                align-items: center;
                gap: 4px;
            }
        </style>
        <script type="module">
            import { renderToDom } from './src/app';
            renderToDom(document.querySelector('#app'));
        </script>
    </head>
    <body>
        <div id="app"></div>
    </body>
</html>
<!-- [END maps_react_circle_simple] -->
