<html>
  <head>
    <title>Add a Map using HTML</title>

    <script
      async
      src="https://maps.googleapis.com/maps/api/js?loading=async&libraries=maps,marker"></script>
  </head>
  <body>
    <gmp-map
      center="37.4220656,-122.0840897"
      zoom="10"
      style="height: 500px"></gmp-map>
  </body>
</html>
