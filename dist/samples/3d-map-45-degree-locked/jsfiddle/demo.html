<html>
  <head>
    <title>3d map 45-degree perspective</title>
    <script
      async
      src="https://maps.googleapis.com/maps/api/js?loading=async&libraries=maps3d"></script>
  </head>
  <body>
    <gmp-map-3d
      id="gmp-map-3d"
      center="37.789,-122.401,0"
      range="2200"
      tilt="45"
      heading="188"
      min-tilt="0"
      max-tilt="45"
      mode="satellite">
    </gmp-map-3d>
  </body>
</html>
